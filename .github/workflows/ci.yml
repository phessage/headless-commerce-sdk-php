name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    strategy: {matrix: {php: ['8.2','8.3','8.4']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}'}
      - run: php -l src/Client.php
      - run: php tests/run.php
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:laravel
  deployed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deployed non-mutating bootstrap probe
        run: curl --fail --silent --show-error https://api.1ecomm.com/v1/headless/stores/01f5b02f-d7c0-42cd-b880-59f78ea70aa3/config >/dev/null
