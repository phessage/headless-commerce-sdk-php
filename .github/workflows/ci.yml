name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    strategy: {matrix: {php: ['8.2','8.3','8.4']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}'}
      - run: php -l src/Client.php
      - run: php tests/run.php
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:laravel
  deployed-journey:
    runs-on: ubuntu-latest
    env: {HEADLESS_E2E_ALLOCATOR_TOKEN: '${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - name: Allocate isolated deployed fixture
        run: bash .github/scripts/headless-fixture.sh allocate
      - name: Run deployed catalog-to-order journey
        run: php tests/live.php
      - name: Release isolated deployed fixture
        if: always()
        run: bash .github/scripts/headless-fixture.sh release
