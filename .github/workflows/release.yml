name: Release package
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version for the immutable release tag, required: true, type: string}
permissions: {contents: write}
concurrency: {group: php-sdk-release, cancel-in-progress: false}
jobs:
  release:
    runs-on: [self-hosted, Linux, X64, docker-services]
    container: php:8.2-cli
    environment: package-release
    env: {RELEASE_VERSION: '${{ inputs.version }}'}
    steps:
      - name: Install git for checkout and tagging inside the job container
        run: apt-get update && apt-get install --no-install-recommends -y git unzip ca-certificates
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Composer inside the job container
        run: curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - name: Install GitHub CLI into the job workspace
        run: |
          v=2.62.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Verify immutable release identity
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          ! git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1
      - run: composer install --prefer-dist --no-interaction
      - run: composer check
      - run: bash scripts/package-smoke.sh
      - name: Build release archive, manifest and checksums
        run: |
          mkdir release
          composer archive --format=zip --dir=release
          composer show --locked --format=json > release/composer-dependencies.json
          printf '{"package":"phessage/headless-commerce-sdk","version":"%s","commit":"%s","format":"composer-vcs"}\n' "$RELEASE_VERSION" "$GITHUB_SHA" > release/release-manifest.json
          sha256sum release/* > release/SHA256SUMS
      - name: Create immutable tag and GitHub release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          git tag "v$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" release/* --verify-tag --title "v$RELEASE_VERSION" --generate-notes
