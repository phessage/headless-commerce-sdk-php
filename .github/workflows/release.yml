name: Release package
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version for the immutable release tag, required: true, type: string}
permissions: {contents: write}
concurrency: {group: php-sdk-release, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-latest
    environment: package-release
    env: {RELEASE_VERSION: '${{ inputs.version }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', tools: 'composer:v2'}
      - name: Verify immutable release identity
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          ! git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1
      - run: composer install --prefer-dist --no-interaction
      - run: composer check
      - run: bash scripts/package-smoke.sh
      - name: Build release archive, manifest and checksums
        run: |
          mkdir release
          composer archive --format=zip --dir=release
          composer show --locked --format=json > release/composer-dependencies.json
          printf '{"package":"phessage/headless-commerce-sdk","version":"%s","commit":"%s","format":"composer-vcs"}\n' "$RELEASE_VERSION" "$GITHUB_SHA" > release/release-manifest.json
          shasum -a 256 release/* > release/SHA256SUMS
      - name: Create immutable tag and GitHub release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          git tag "v$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" release/* --verify-tag --title "v$RELEASE_VERSION" --generate-notes
